<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Duck Sword pixel-art texture (16x16) -->
  <!-- Blade shaped with a duck head pommel -->

  <!-- Handle / grip -->
  <rect x="7" y="11" width="2" height="3" fill="#8B5A2B"/>
  <rect x="6" y="10" width="4" height="1" fill="#C19A6B"/>

  <!-- Crossguard (duck wings) -->
  <rect x="3" y="9" width="10" height="1" fill="#D4AF37"/>
  <rect x="2" y="8" width="12" height="1" fill="#B8860B"/>

  <!-- Blade -->
  <rect x="6" y="2" width="4" height="6" fill="#E5E4E2"/>
  <rect x="5" y="3" width="6" height="1" fill="#D3D3D3"/>
  <rect x="7" y="1" width="2" height="1" fill="#E5E4E2"/>
  <rect x="7" y="4" width="2" height="4" fill="#C0C0C0"/>
  <rect x="6" y="3" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="3" width="1" height="1" fill="#FFFFFF"/>

  <!-- Pommel - duck head -->
  <rect x="6" y="14" width="4" height="2" fill="#FFD700"/>
  <rect x="5" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="5" y="15" width="1" height="1" fill="#DAA520"/>
  <!-- Duck eye -->
  <rect x="9" y="14" width="1" height="1" fill="#000000"/>
  <!-- Duck beak -->
  <rect x="4" y="14" width="1" height="2" fill="#FF8C00"/>
  <!-- Duck bill -->
  <rect x="3" y="15" width="1" height="1" fill="#FF8C00"/>
</svg>
